<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rideekanda — Admin</title>
<link rel="icon" type="image/png" href="images/rideekanda-logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Noto+Sans+Sinhala:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20" />
<script>
  // The public site's day/night toggle owns "rk-theme" and writes light/dark
  // into it, so this app keeps its palette under its own "rq-" keys. An older
  // choice is carried over once, but only when it really is a palette name.
  var RQ_THEMES = ["saffron", "claret", "indigo", "ochre", "sage"];
  var RQ_MODES  = ["day", "night"];
  function rqPref(key, legacyKey, valid, fallback) {
    try {
      var v = localStorage.getItem(key);
      if (valid.indexOf(v) >= 0) return v;
      var old = localStorage.getItem(legacyKey);
      v = valid.indexOf(old) >= 0 ? old : fallback;
      localStorage.setItem(key, v);
      return v;
    } catch (e) { return fallback; }
  }
  document.documentElement.setAttribute("data-theme", rqPref("rq-theme", "rk-theme", RQ_THEMES, "saffron"));
  document.documentElement.setAttribute("data-mode",  rqPref("rq-mode",  "rk-mode",  RQ_MODES,  "day"));
</script>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="data.js"></script>
<script src="supabase.js?v=5"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="admin.jsx?v=8"></script>
<script type="text/babel">
  const Admin = window.RideekandaAdmin;
  ReactDOM.createRoot(document.getElementById("root")).render(<Admin />);
</script>
</body>
</html>
