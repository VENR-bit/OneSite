<style>
  :root {
    --bg: #f4ede0;
    --bg-deep: #ece3d1;
    --card: #fdfbf6;
    --ink: #1f1a14;
    --ink-soft: #4a4034;
    --muted: #8a7d68;
    --line: #e6dcc6;
    --accent: #2d4a32;
    --accent-soft: #5b7a5f;
    --gold: #c08a3e;
    --star: #e6a93b;
    --shadow-sm: 0 1px 2px rgba(57, 44, 22, 0.04), 0 0 0 1px rgba(57, 44, 22, 0.04);
    --shadow-md: 0 12px 32px -16px rgba(57, 44, 22, 0.18), 0 2px 6px -2px rgba(57, 44, 22, 0.06), 0 0 0 1px rgba(57, 44, 22, 0.04);
    --serif: "Cormorant Garamond", "Cormorant", Georgia, serif;
    --sans: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  /* Subtle paper texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(192, 138, 62, 0.04), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(45, 74, 50, 0.04), transparent 50%);
    z-index: 0;
  }

  #root { position: relative; z-index: 1; }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* Loading state */
  .boot {
    min-height: 100vh;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
  }
  .boot .lotus {
    width: 88px; height: auto; opacity: 0.6; margin: 0 auto 16px; display: block;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.4; transform: scale(0.96); }
    50% { opacity: 0.85; transform: scale(1.04); }
  }

  /* Night palette: render the lotus mark white. */
  :root[data-theme="dark"] .rk-lotus,
  :root[data-theme="dark"] .boot .lotus { filter: brightness(0) invert(1); }
</style>

  <script>(function(){function place(){var w=document.querySelector(".rk-watermark");if(!w)return;var cs=document.querySelectorAll(".hero .lotus-mark,.lotus-mark,.lotus,.rk-lotus");var logo=null;for(var i=0;i<cs.length;i++){var c=cs[i];if(c===w)continue;var r=c.getBoundingClientRect();if(r.top>=0&&r.top<700&&r.width>20){logo=c;break;}}if(!logo)return;var lr=logo.getBoundingClientRect();w.style.top=(lr.bottom+window.scrollY-8)+"px";}if(document.readyState!=="loading")place();else document.addEventListener("DOMContentLoaded",place);[200,700,1500].forEach(function(t){setTimeout(place,t);});window.addEventListener("resize",place);})();</script>
