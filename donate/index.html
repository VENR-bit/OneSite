<script>(function(){try{var m=localStorage.getItem("rk-theme");if(m!=="light"&&m!=="dark"&&m!=="auto")m="auto";var h=new Date().getHours();var t=(m==="auto")?((h>=6&&h<18)?"light":"dark"):m;var r=document.documentElement;r.setAttribute("data-theme",t);r.setAttribute("data-theme-mode",m);}catch(e){}})();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Rideekanda Forest Monastery — Support</title>

<!-- eco-header -->

  <script id="eco-header" src="../eco-header.js?v=2" data-root="../" data-links='[]' data-pad="true" defer></script>
<!-- eco-nav -->
  <link rel="stylesheet" href="../eco-nav.css?v=10">
  <script id="eco-nav" src="../eco-nav.js?v=23" data-root="../" data-current="donate" defer></script>
  <!-- eco-footer -->
  <link rel="stylesheet" href="../eco-footer.css?v=3">
  <script id="eco-footer" src="../eco-footer.js?v=4" data-root="../" defer></script>
  <!-- eco-theme -->
  <link rel="stylesheet" href="../eco-theme.css?v=3">
  <script src="../eco-theme.js?v=3" defer></script>
  <!-- Donate night palette. Placed after eco-theme.css so it keeps the page's
       terracotta identity (instead of eco-theme's gold) and covers the donate-
       specific variables. -->
  <style>
    :root[data-theme="dark"] {
      --bg: #1f1a14; --bg-2: #16120d; --bg-3: #2a241c; --card: #2a241c;
      --ink: #f3ecdb; --ink-2: #d8ccb4; --muted: #9d8d72;
      --line: rgba(255,235,200,0.16); --line-soft: rgba(255,235,200,0.08);
      --accent: #c8573a; --accent-2: #a8432b; --leaf: #7d9e81; --gold: #cdab6a;
    }
    /* Selected cards fill with the accent in dark (instead of the light-ink
       flip), keeping their light sub-text readable. */
    :root[data-theme="dark"] .method.active,
    :root[data-theme="dark"] .amount.selected,
    :root[data-theme="dark"] .bank-tab.active {
      background: var(--accent); color: #fdf3ea; border-color: var(--accent);
    }
    :root[data-theme="dark"] .method.active .method-icn { color: #fdf3ea; opacity: 0.9; }
    /* Keep the QR card light so the code stays scannable. */
    :root[data-theme="dark"] .qr-card { background: #faf4e4; color: #2a2519; border-color: rgba(20,17,11,0.18); }
    :root[data-theme="dark"] .qr-card-foot { color: #6b6450; }
    /* White lotus on the night palette. */
    :root[data-theme="dark"] .hero .lotus-mark { filter: brightness(0) invert(1); }
  </style>
</body>
