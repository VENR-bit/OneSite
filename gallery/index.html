  <script>(function(){function place(){var w=document.querySelector(".rk-watermark");if(!w)return;var cs=document.querySelectorAll(".hero .lotus-mark,.lotus-mark,.lotus,.rk-lotus");var logo=null;for(var i=0;i<cs.length;i++){var c=cs[i];if(c===w)continue;var r=c.getBoundingClientRect();if(r.top>=0&&r.top<700&&r.width>20){logo=c;break;}}if(!logo)return;var lr=logo.getBoundingClientRect();w.style.top=(lr.bottom+window.scrollY-8)+"px";}if(document.readyState!=="loading")place();else document.addEventListener("DOMContentLoaded",place);[200,700,1500].forEach(function(t){setTimeout(place,t);});window.addEventListener("resize",place);})();</script>
